name: Notify Orchard Core Gallery

# When modules or themes change on main, tell the Orchard Core Gallery to
# rebuild and redeploy so the published site reflects the latest catalog.
on:
  push:
    branches:
      - main
    paths:
      - "modules/**"
      - "themes/**"
  # Allow manual triggering from the Actions tab too.
  workflow_dispatch:

jobs:
  notify:
    runs-on: ubuntu-latest
    env:
      GALLERY_REPOSITORY: OrchardCMS/OrchardCore.Gallery
    steps:
      - name: Verify gallery dispatch token
        env:
          GH_TOKEN: ${{ secrets.GALLERY_DISPATCH_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::GALLERY_DISPATCH_TOKEN is not configured."
            exit 1
          fi

          if ! gh api /user --jq '.login' >/dev/null; then
            echo "::error::GALLERY_DISPATCH_TOKEN is not a valid GitHub token."
            exit 1
          fi

          if ! gh api "/repos/${GALLERY_REPOSITORY}" --jq '.full_name' >/dev/null; then
            echo "::error::GALLERY_DISPATCH_TOKEN is valid, but it cannot access ${GALLERY_REPOSITORY}. Verify the token is authorized for the OrchardCMS organization, selected for this private repository, and owned by a user with access to it."
            exit 1
          fi

      - name: Trigger gallery rebuild
        env:
          GH_TOKEN: ${{ secrets.GALLERY_DISPATCH_TOKEN }}
        run: |
          if ! gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            "/repos/${GALLERY_REPOSITORY}/dispatches" \
            -f event_type=extensions-updated \
            -f "client_payload[source_sha]=${{ github.sha }}"; then
            echo "::error::GALLERY_DISPATCH_TOKEN can access ${GALLERY_REPOSITORY}, but cannot create a repository_dispatch event. For a fine-grained PAT, grant Contents: Read and write on the Gallery repository and have the updated token request approved."
            exit 1
          fi
